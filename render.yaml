services:
  - type: web
    name: livestock-detection-api
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_JSON_FORMAT
        value: "true"
      - key: API_KEY
        sync: false   # set manually in Render Dashboard
      - key: PYTHON_VERSION
        value: 3.11.9